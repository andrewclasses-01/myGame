<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>RACING WORDS — Mẫu 3o · gói nhúng AWord</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,600;0,700;0,800;0,900;1,800;1,900&subset=vietnamese&display=swap" rel="stylesheet">
<link rel="stylesheet" href="core/sr3d-3g.css">
<link rel="stylesheet" href="core/sr3d-3l.css">
<link rel="stylesheet" href="core/sr3d-intro-3o.css">
<link rel="stylesheet" href="core/rw-3o.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #host { position: fixed; inset: 0; }
  /* bảng Options GIẢ (thay bảng thật của AWord khi thử ở myGame) */
  .fake-opt { position: absolute; left: 50%; transform: translateX(-50%); width: min(520px, 92%); background: #f4f6fa; color: #1b2433; border-radius: 16px; padding: 16px 18px; z-index: 90;
    box-shadow: 0 10px 40px rgba(0,0,0,.5); font: 600 15px system-ui; }
  .fake-opt h3 { margin: 0 0 10px; } .fake-opt label { display: flex; justify-content: space-between; margin: 8px 0; align-items: center; }
  .fake-opt .act { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; } .fake-opt button { padding: 8px 14px; border-radius: 10px; border: 0; background: #2f6fe0; color: #fff; font-weight: 700; cursor: pointer; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="host"></div>
<script type="module">
// Trang thử mẫu 3o: dựng game bằng GÓI NHÚNG (core/rw-3o.js) y như AWord sẽ làm, với cầu host GIẢ (bảng Options giả, danh sách act giả).
// iPad thử: pad-3o.html?t=0 / ?t=1 ở tab khác (kênh cục bộ srpad3o).
import { createRacingWords } from "./core/rw-3o.js";
import { createPadHost, localSignal } from "./core/sr3d-padlink-3e.js";
import { QUESTIONS, TITLE } from "../maze-chase/core/questions-sample.js";
let opts = { steps: 12, laps: 0, ramps: true, sameQ: true, msMax: 3 };
let rw = null;
const hostEl = document.getElementById("host");
const host = {
  options({ layer, top, onClose }) {
    const p = document.createElement("div"); p.className = "fake-opt"; p.style.bottom = (layer.clientHeight - top() + 8) + "px";
    p.innerHTML = `<h3>Options (giả — AWord sẽ hiện bảng thật)</h3>
      <label>Questions <select id="q"><option value="1">Same</option><option value="0">Different</option></select></label>
      <label>Missiles max <input id="m" type="number" min="1" max="10" value="${opts.msMax}"></label>
      <label>Track length (segments) <input id="s" type="number" min="3" max="20" value="${opts.steps}"></label>
      <label>Laps (0 = auto) <input id="l" type="number" min="0" max="6" value="${opts.laps}"></label>
      <label>Jump ramps <input id="r" type="checkbox" ${opts.ramps ? "checked" : ""}></label>
      <div class="act"><button id="x">Close</button><button id="a">Apply</button></div>`;
    p.querySelector("#q").value = opts.sameQ ? "1" : "0";
    layer.appendChild(p);
    const close = () => { p.remove(); onClose && onClose(); };
    p.querySelector("#x").onclick = close;
    p.querySelector("#a").onclick = async () => {
      const o = { sameQ: p.querySelector("#q").value === "1", msMax: +p.querySelector("#m").value, steps: +p.querySelector("#s").value, laps: +p.querySelector("#l").value, ramps: p.querySelector("#r").checked };
      opts = { ...opts, ...o }; close();
      if (!rw.setOptions(o)) { rw.destroy(); rw = await build(); }   // như AWord: setOptions false ⇒ dựng lại
    };
  },
  listActs: async () => ({ folderName: "Space words", groups: [{ path: "", acts: [{ id: 1, title: "Space words 1", current: true }, { id: 2, title: "Planets" }, { id: 3, title: "Solar system" }] }] }),
  openAct: id => alert("AWord sẽ mở act " + id),
  templates: () => [{ type: "rocket_race", label: "Rocket race" }, { type: "maze_chase", label: "Star loot" }],
  switchTemplate: t => alert("AWord sẽ đổi sang " + t),
  home: () => alert("AWord sẽ về Library")
};
const remote = createPadHost({ signal: localSignal("srpad3o"), padUrl: t => new URL("pad-3o.html?t=" + t, location.href).href });
const build = () => createRacingWords({ mount: hostEl, questions: QUESTIONS, title: "RACING WORDS", options: opts, host, remote, onEvent: (k, v) => { if (k !== "fps") console.log("RW", k, v); } });
rw = await build();
window.__rw = () => rw;
</script>
</body>
</html>
