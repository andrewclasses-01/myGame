<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RACING WORDS — iPad (mẫu 5b · vô lăng lơ lửng)</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Exo+2:ital,wght@0,600;0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="core/rw-4j-fb.css">
</head>
<body>
<div id="pad"></div>
<script type="module">
// Bàn thử myGame mẫu 4l: iPad ĐỘI (?t=0 / ?t=1) hoặc iPad DRONE (?t=2) — kênh cục bộ "srpad4f" (cùng trình duyệt với mau-4l-drone-ipad.html).
// Không có ?t ⇒ màn chọn vai 3 nút. Nhiều "iPad" cùng trình duyệt: thêm &dev=a / &dev=b / &dev=c.
import { createPadClient, localSignal, watchTeams } from "./core/sr3d-padlink-5a.js";
import { mountPadApp, mountPadChooser, mountDroneApp } from "./core/sr3d-padui-5b.js";
const SIG = localSignal("srpad4f");
const q = new URLSearchParams(location.search), mount = document.getElementById("pad");
const goTeam = t => { q.set("t", t); location.href = "?" + q; };
if (!q.has("t")) { const ch = mountPadChooser(mount, { onPick: goTeam }); watchTeams(SIG, b => ch.setBusy(b)); window.__ch = ch; }
else {
  const team = q.get("t") === "2" ? 2 : q.get("t") === "1" ? 1 : 0;
  let ui = null, pend = {};
  const call = (k, v) => ui ? ui[k] && ui[k](v) : (pend[k] = v);
  const client = createPadClient({ signal: SIG, team,
    onState: s => call("setState", s), onInfo: i => call("setInfo", i), onMode: m => call("setMode", m), onQ: x => call("setQ", x), onSteer: x => call("setSteer", x), onDrone: j => call("setDrone", j) });
  const back = () => { client.destroy(); q.delete("t"); location.href = "?" + q; };
  ui = team === 2 ? mountDroneApp(mount, { client, onBack: back }) : mountPadApp(mount, { team, client, onBack: back });
  ui.setState(client.state); Object.entries(pend).forEach(([k, v]) => ui[k] && ui[k](v));
  window.__padc = client; window.__padui = ui;
}
</script>
</body>
</html>
