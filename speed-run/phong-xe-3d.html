<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPEED RUN · Phòng trưng bày xe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,500;0,700;1,900&display=swap" rel="stylesheet">
<style>
:root { --bg:#05070a; --pn:rgba(14,18,25,.86); --line:#26303d; --tx:#e8edf3; --mu:#8893a3; --t1:#3b8cff; --t2:#ff7a00; --ok:#35d07f; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--tx); font-family:"Exo 2",system-ui,sans-serif; overflow:hidden; }
canvas { display:block; }
#top { position:fixed; left:0; right:0; top:0; display:flex; align-items:center; gap:14px; padding:10px 16px; background:linear-gradient(#05070ae6,#05070a00); z-index:3; }
h1 { margin:0; font-style:italic; font-weight:900; letter-spacing:2px; font-size:20px; white-space:nowrap; }
h1 b { color:var(--t1); }
#list { display:flex; gap:6px; overflow-x:auto; flex:1; padding-bottom:2px; scrollbar-width:thin; }
.chip { flex:none; cursor:pointer; border:1px solid var(--line); background:var(--pn); color:var(--tx); border-radius:8px; padding:5px 10px; font:inherit; font-size:13px; }
.chip b { font-style:italic; margin-right:5px; }
.chip.on { border-color:#fff; background:#1f2733; }
.chip.pk { box-shadow:inset 0 -3px 0 var(--ok); }
.chip.wait { opacity:.4; }
#info { position:fixed; left:18px; bottom:18px; z-index:3; max-width:min(520px,calc(100% - 36px)); }
#nm { font-size:clamp(24px,3.4vw,42px); font-weight:900; font-style:italic; letter-spacing:1px; line-height:1.05; text-shadow:0 2px 18px #000; }
#sub { color:var(--mu); font-size:13px; margin-top:6px; }
#ctl { position:fixed; right:18px; bottom:18px; z-index:3; display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
.row { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
button.b { cursor:pointer; font:inherit; font-size:14px; border:1px solid var(--line); background:var(--pn); color:var(--tx); border-radius:9px; padding:8px 13px; }
button.b.on { border-color:#fff; background:#253042; }
.sw { width:14px; height:14px; border-radius:50%; display:inline-block; vertical-align:-2px; margin-right:6px; border:1px solid #fff6; }
#pick.on { background:var(--ok); color:#04130a; border-color:var(--ok); font-weight:700; }
#load { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:2; color:var(--mu); font-size:15px; letter-spacing:1px; }
#cred { position:fixed; right:18px; top:56px; z-index:3; color:#6c7686; font-size:11px; text-align:right; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="top"><h1>SPEED RUN · <b>GARAGE</b></h1><div id="list"></div><button class="b" id="copy">Chép danh sách</button></div>
<div id="cred"></div>
<div id="load">Đang tải xe…</div>
<div id="info"><div id="nm"></div><div id="sub"></div></div>
<div id="ctl">
  <div class="row">
    <button class="b" data-c="orig">Màu gốc</button>
    <button class="b on" data-c="#3b8cff"><span class="sw" style="background:#3b8cff"></span>TEAM 1</button>
    <button class="b" data-c="#ff7a00"><span class="sw" style="background:#ff7a00"></span>TEAM 2</button>
    <button class="b" data-c="duo">2 đội cạnh nhau</button>
  </div>
  <div class="row">
    <button class="b on" id="spin">⟳ Xoay</button>
    <button class="b" id="pick">Chọn xe này</button>
  </div>
</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { XE, loadXe, setPaint } from "./core/sr3d-xe3d.js";

const R = new THREE.WebGLRenderer({ antialias: true });
R.setPixelRatio(Math.min(devicePixelRatio, 2)); R.setSize(innerWidth, innerHeight);
R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.0;
R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(R.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x05070a); scene.fog = new THREE.Fog(0x05070a, 14, 34);
const pm = new THREE.PMREMGenerator(R); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.9;
const cam = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 200); cam.position.set(7.2, 2.4, 7.6);
const oc = new OrbitControls(cam, R.domElement); oc.target.set(0, 0.55, 0); oc.enableDamping = true; oc.minDistance = 3.5; oc.maxDistance = 18; oc.maxPolarAngle = Math.PI * 0.49;
// sàn phòng trưng bày: bóng loáng tối + vòng sáng
const floor = new THREE.Mesh(new THREE.CircleGeometry(30, 96), new THREE.MeshStandardMaterial({ color: 0x0b0e13, roughness: 0.85, metalness: 0.0 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const ring = new THREE.Mesh(new THREE.RingGeometry(3.9, 3.98, 128), new THREE.MeshBasicMaterial({ color: 0x3b8cff, transparent: true, opacity: 0.7 }));
ring.rotation.x = -Math.PI / 2; ring.position.y = 0.003; scene.add(ring);
const disc = new THREE.Mesh(new THREE.CircleGeometry(3.9, 96), new THREE.MeshStandardMaterial({ color: 0x10141b, roughness: 0.6, metalness: 0.2 }));
disc.rotation.x = -Math.PI / 2; disc.position.y = 0.002; disc.receiveShadow = true; scene.add(disc);
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(4, 9, 5); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 1, far: 25 }); key.shadow.bias = -0.0004; key.shadow.radius = 4; scene.add(key);
const rim = new THREE.SpotLight(0x9cc4ff, 60, 30, 0.6, 0.7); rim.position.set(-6, 5, -6); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x080a0e, 0.35));
// dải đèn trần (phản chiếu lên sơn xe)
for (const z of [-2.2, 0, 2.2]) { const s = new THREE.Mesh(new THREE.PlaneGeometry(9, 0.18), new THREE.MeshBasicMaterial({ color: 0xffffff })); s.position.set(0, 7, z); s.rotation.x = Math.PI / 2; scene.add(s); }

const stage = new THREE.Group(); scene.add(stage);
const KEY = "srGarageXe3d";
let st = { id: null, color: "#3b8cff", pick: [] };
try { Object.assign(st, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
const ready = XE.filter(x => x.ok !== false);
if (!st.id || !ready.find(x => x.id === st.id)) st.id = ready[0]?.id;
const L = document.getElementById("list");
for (const x of XE) {
  const b = document.createElement("button"); b.className = "chip" + (x.ok === false ? " wait" : ""); b.dataset.id = x.id;
  b.innerHTML = `<b style="color:${x.id[0] === "Y" ? "#ff9a2e" : "#3b8cff"}">${x.id}</b>${x.short}`;
  b.onclick = () => { if (x.ok !== false) show(x.id); }; L.appendChild(b);
}
let token = 0, spin = true;
async function show(id) {
  st.id = id; save(); const my = ++token;
  document.getElementById("load").style.display = "flex";
  const cfg = XE.find(x => x.id === id);
  const duo = st.color === "duo";
  const cars = await Promise.all((duo ? [0, 1] : [0]).map(() => loadXe(id)));
  if (my !== token) return;
  stage.clear(); ring.visible = disc.visible = true;
  cars.forEach((c, i) => {
    setPaint(c, duo ? ["#3b8cff", "#ff7a00"][i] : st.color === "orig" ? null : st.color);
    if (duo) c.position.x = (i ? 1 : -1) * (c.userData.size.x * 0.5 + 0.45);
    stage.add(c);
  });
  ring.material.color.set(duo || st.color === "orig" ? "#ffffff" : st.color);
  document.getElementById("load").style.display = "none";
  document.getElementById("nm").textContent = cfg.name;
  const s = cars[0].userData.size;
  document.getElementById("sub").innerHTML = `${cfg.id} · dài ${s.z.toFixed(2)} m · rộng ${s.x.toFixed(2)} m · cao ${s.y.toFixed(2)} m · ${(cfg.tris / 1000).toFixed(0)}k tam giác · ${cfg.mb} MB`;
  document.getElementById("cred").innerHTML = `Mẫu 3D: “${cfg.name}” — ${cfg.author} · ${cfg.lic} · Sketchfab`;
  document.querySelectorAll(".chip").forEach(b => { b.classList.toggle("on", b.dataset.id === id); b.classList.toggle("pk", st.pick.includes(b.dataset.id)); });
  document.getElementById("pick").classList.toggle("on", st.pick.includes(id));
  document.getElementById("pick").textContent = st.pick.includes(id) ? "✓ Đã chọn" : "Chọn xe này";
}
document.querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
  st.color = b.dataset.c; save();
  document.querySelectorAll("[data-c]").forEach(x => x.classList.toggle("on", x === b)); show(st.id);
});
document.querySelectorAll("[data-c]").forEach(x => x.classList.toggle("on", x.dataset.c === st.color));
document.getElementById("spin").onclick = e => { spin = !spin; e.currentTarget.classList.toggle("on", spin); };
document.getElementById("pick").onclick = () => { const i = st.pick.indexOf(st.id); i < 0 ? st.pick.push(st.id) : st.pick.splice(i, 1); save(); show(st.id); };
document.getElementById("copy").onclick = async () => {
  const t = "Garage chọn: " + XE.filter(x => st.pick.includes(x.id)).map(x => x.id + " " + x.short).join(" · ");
  try { await navigator.clipboard.writeText(t); document.getElementById("copy").textContent = "✓ Đã chép"; } catch (e) { prompt("Chép dòng này:", t); }
};
addEventListener("keydown", e => { if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const i = ready.findIndex(x => x.id === st.id), n = ready.length; show(ready[(i + (e.key === "ArrowRight" ? 1 : n - 1)) % n].id); });
addEventListener("resize", () => { R.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });
const clk = new THREE.Clock();
R.setAnimationLoop(() => { const dt = clk.getDelta(); if (spin) stage.rotation.y += dt * 0.25; oc.update(); R.render(scene, cam); });
// cả dàn xe xếp hàng ngang (mũi xe hướng −z), để so dáng và kiểm hướng
async function lineup(color = "#3b8cff") {
  const my = ++token; spin = false; document.getElementById("spin").classList.remove("on");
  const cars = await Promise.all(ready.map(x => loadXe(x.id)));
  if (my !== token) return;
  stage.clear(); stage.rotation.y = 0; ring.visible = disc.visible = false;
  const gap = 2.75, x0 = -(cars.length - 1) * gap / 2;
  cars.forEach((c, i) => { setPaint(c, color); c.position.x = x0 + i * gap; stage.add(c); });
  document.getElementById("load").style.display = "none";
  document.getElementById("nm").textContent = "Cả dàn xe"; document.getElementById("sub").textContent = ready.map(x => x.id).join(" · ");
}
window.__garage = { show, stage, scene, cam, oc, lineup, spin: v => { spin = v; } };
if (st.id) show(st.id);
</script>
</body>
</html>
