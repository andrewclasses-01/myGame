<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>STAR LOOT — iPad D-pad</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div id="pad"></div>
<script type="module">
// Bàn thử myGame: D-pad cho iPad, kênh bắt tay cục bộ (cùng trình duyệt với mau-2q). ?t=0 đội A · ?t=1 đội B · không có ?t ⇒ màn chọn đội
import { createPadClient, localSignal } from "./core/mc3d-padlink-2q.js";
import { mountPadUI, mountPadChooser } from "./core/mc3d-padui-2q.js";
const q = new URLSearchParams(location.search), mount = document.getElementById("pad");
const goTeam = t => { q.set("t", t); location.href = "?" + q; };
if (!q.has("t")) mountPadChooser(mount, { onPick: goTeam });
else {
  const team = q.get("t") === "1" ? 1 : 0;
  let ui = null;
  const client = createPadClient({ signal: localSignal(), team, onState: s => ui && ui.setState(s) });
  ui = mountPadUI(mount, { team, send: k => client.send(k), onBack: () => { client.destroy(); q.delete("t"); location.href = "?" + q; } });
  ui.setState(client.state);
  window.__padc = client;
}
</script>
</body>
</html>
