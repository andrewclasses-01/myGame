<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>STAR LOOT — iPad D-pad</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div id="pad"></div>
<script type="module">
// Bàn thử myGame: D-pad cho iPad, kênh bắt tay cục bộ (cùng trình duyệt với mau-2q). ?t=0 đội A · ?t=1 đội B
import { createPadClient, localSignal } from "./core/mc3d-padlink-2q.js";
import { mountPadUI } from "./core/mc3d-padui-2q.js";
const team = new URLSearchParams(location.search).get("t") === "1" ? 1 : 0;
let ui = null;
const client = createPadClient({ signal: localSignal(), team, onState: s => ui && ui.setState(s) });
ui = mountPadUI(document.getElementById("pad"), { team, send: k => client.send(k) });
ui.setState(client.state);
window.__padc = client;
</script>
</body>
</html>
