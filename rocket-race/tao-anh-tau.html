<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tạo ảnh tàu</title>
<style>
/* MẪU 12b (19/10/2026): CHỤP ẢNH MÔ PHỎNG cho ô chọn trong ⚙ Settings — dựng đúng mô hình game (sơn đội 1, lửa bật), nền trong suốt.
   ?save=1 ⇒ gửi từng ảnh tới máy nhận tạm 127.0.0.1:8877 (scratchpad luu_anh.py) ⇒ rocket-race/tau3d/anh/<id>.webp. Không có ?save ⇒ chỉ xem. */
body{margin:0;background:#0b0e13;color:#e7eef8;font:13px system-ui,sans-serif;padding:12px}
#g{display:flex;flex-wrap:wrap;gap:10px} figure{margin:0;background:#16202e;border-radius:10px;padding:6px} figcaption{text-align:center;margin-top:4px}
img{display:block;width:240px;height:auto}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head><body><div id="g"></div><p id="st">…</p>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { SHIPS, MISSILES, prepShip, prepMissile, makeShipRocket, missileMeshes } from "./game11/rr3d-ships.js";
import { makeRocket, makeFlameMat, DEFAULT_TEAMS } from "./game11/rr3d-view.js";
const SAVE = new URLSearchParams(location.search).get("save") === "1";
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.45;   // như cảnh đua
scene.add(new THREE.HemisphereLight(0x6b8cff, 0x1a0f24, 0.9));
const sun = new THREE.DirectionalLight(0xfff1e0, 3.4); sun.position.set(-4, 6, 6); scene.add(sun);
const rim = new THREE.DirectionalLight(0x7fb2ff, 1.6); rim.position.set(5, 2, -6); scene.add(rim);
const cam = new THREE.PerspectiveCamera(26, 16 / 9, 0.1, 200);
const team = DEFAULT_TEAMS[0];

// tên lửa cũ (Classic) — chép hình từ rr3d-missile.js (dọc +X, dài 2,32)
function classicMissile() {
  const alongX = g => { g.rotateZ(-Math.PI / 2); return g; };
  const lat = (pts, segs = 32) => new THREE.LatheGeometry(pts.map(([r, y]) => new THREE.Vector2(r, y)), segs);
  const nosePts = []; for (let i = 0; i <= 12; i++) { const y = i / 12 * 0.62; nosePts.push([Math.max(0.001, 0.2 * Math.pow(1 - Math.pow(y / 0.62, 2), 0.55)), y]); }
  const fs = new THREE.Shape(); fs.moveTo(0, 0); fs.lineTo(0.46, 0); fs.lineTo(0.3, 0.3); fs.lineTo(0.08, 0.3); fs.closePath();
  const fin = new THREE.ExtrudeGeometry(fs, { depth: 0.035, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.012, bevelSegments: 2 }); fin.translate(-1.1, 0.17, -0.0175);
  const red = new THREE.MeshPhysicalMaterial({ color: "#d4121e", metalness: 0.35, roughness: 0.3, clearcoat: 1, emissive: new THREE.Color("#ff1a24"), emissiveIntensity: 0.22 });
  const redD = new THREE.MeshPhysicalMaterial({ color: "#8e0b14", metalness: 0.4, roughness: 0.35, clearcoat: 0.8 });
  const white = new THREE.MeshPhysicalMaterial({ color: "#eef0f3", metalness: 0.2, roughness: 0.35, clearcoat: 0.6 });
  const dark = new THREE.MeshStandardMaterial({ color: "#2b3039", metalness: 0.85, roughness: 0.32 });
  const g = new THREE.Group();
  g.add(new THREE.Mesh(alongX(new THREE.CylinderGeometry(0.2, 0.2, 1.5, 32)).translate(-0.2, 0, 0), red), new THREE.Mesh(alongX(lat(nosePts)).translate(0.55, 0, 0), red),
    new THREE.Mesh(alongX(lat([[0.001, -0.2], [0.13, -0.2], [0.17, -0.12], [0.2, 0]])).translate(-0.95, 0, 0), dark));
  [0.43, -0.72].forEach(x => { const b = new THREE.Mesh(alongX(new THREE.CylinderGeometry(0.204, 0.204, 0.07, 32, 1, true)), white); b.position.x = x; g.add(b); });
  for (let k = 0; k < 4; k++) { const f = new THREE.Mesh(fin, redD); f.rotation.x = k * Math.PI / 2 + Math.PI / 4; g.add(f); }
  return g;
}
function lit(r) {                                            // lửa đuôi bật như lúc bay
  r.flameGroup.visible = true; r.flameGroup.scale.set(1, 1.15, 1);
  [r.flameOuter, r.flameInner].forEach(m => { m.material.uniforms.uTime.value = 1.3; m.material.uniforms.uPow.value = 0.55; });
  r.nozzleGlow.visible = true; r.light.intensity = 4; r.shield.visible = false;
}
async function shot(obj, name, w, h, dir) {
  scene.add(obj); obj.updateMatrixWorld(true);
  const box = new THREE.Box3(); obj.traverse(o => { if (o.isMesh && o.visible && !(o.material && o.material.isShaderMaterial)) box.expandByObject(o); });
  const c = box.getCenter(new THREE.Vector3()), rad = box.getSize(new THREE.Vector3()).length() / 2;
  renderer.setSize(w, h); cam.aspect = w / h; cam.fov = 26; cam.updateProjectionMatrix();
  const d = rad / Math.sin(THREE.MathUtils.degToRad(cam.fov / 2)) * (w / h > 2 ? 0.42 : 0.66);
  cam.position.copy(c).addScaledVector(new THREE.Vector3(...dir).normalize(), d); cam.lookAt(c);
  renderer.render(scene, cam);
  const blob = await new Promise(res => renderer.domElement.toBlob(res, "image/webp", 0.9));
  scene.remove(obj);
  const url = URL.createObjectURL(blob);
  document.getElementById("g").insertAdjacentHTML("beforeend", `<figure><img src="${url}"><figcaption>${name} · ${(blob.size / 1024).toFixed(1)} KB</figcaption></figure>`);
  if (SAVE) await fetch(`http://127.0.0.1:8877/save?name=${name}.webp`, { method: "POST", body: blob });
}
const SHIP_DIR = [-0.62, 0.42, 0.78], MIS_DIR = [-0.15, 0.32, 1];
for (const s of SHIPS) {
  let r;
  if (s.file) r = makeShipRocket(await prepShip(s.id), team, 0, { flameMat: makeFlameMat });
  else r = makeRocket(team, 0, { color: "#a9b1bd", roughness: 0.48, clearcoat: 0.35, env: 0.55 });
  lit(r);
  await shot(r.rig, "ship-" + s.id, 320, 180, SHIP_DIR);
}
for (const m of MISSILES) {
  const g = m.file ? missileMeshes(await prepMissile(m.id)) : classicMissile();
  g.rotation.z = 0.12;
  await shot(g, "missile-" + m.id, 320, 110, MIS_DIR);
}
document.getElementById("st").textContent = SAVE ? "ĐÃ LƯU " + (SHIPS.length + MISSILES.length) + " ảnh" : "xem thử (thêm ?save=1 để lưu)";
window.__done = true;
</script></body></html>
