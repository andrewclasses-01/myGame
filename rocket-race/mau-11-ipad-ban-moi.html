<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ROCKET RACE — iPad mẫu 11</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,700;0,800;0,900;1,900&family=Baloo+2:wght@700;800;900&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#03050b;overscroll-behavior:none;font-family:"Exo 2",system-ui,sans-serif;color:#e2e8f0;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#cv{position:fixed;inset:0;touch-action:none}
#cv canvas{display:block;width:100%;height:100%}
/* viền đỏ báo động (tên lửa địch đang bay tới) */
#warn{position:fixed;inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 0 1.1vmin rgba(255,40,30,.95),inset 0 0 14vmin rgba(255,30,20,.7)}
/* thanh trên: giữ như bảng iPad hiện tại (đội · đèn nối · đường đua mini) */
.top{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:2vmin;padding:max(2.2vmin,env(safe-area-inset-top)) 2.6vmin 0;pointer-events:none}
.back{width:8.5vmin;height:8.5vmin;border-radius:2.2vmin;border:0;background:rgba(255,255,255,.08);color:#cbd5e1;font:900 5vmin/1 "Exo 2";pointer-events:auto}
.team{padding:1.2vmin 2.6vmin;border-radius:2.2vmin;background:var(--tc);color:#fff;font:900 3.4vmin/1 "Exo 2";letter-spacing:.1em}
.link{display:flex;align-items:center;gap:1vmin;font:700 2.1vmin "Exo 2";color:#94a3b8;white-space:nowrap}
.link i{width:2.1vmin;height:2.1vmin;border-radius:50%;background:#22c55e;box-shadow:0 0 1.4vmin #22c55e}
.track{position:relative;flex:1;height:10vmin;min-width:20vmin}
.track::before{content:"";position:absolute;left:2vmin;right:4vmin;top:50%;height:.6vmin;border-radius:.3vmin;background:rgba(148,163,184,.3)}
.flag{position:absolute;right:0;top:50%;transform:translateY(-50%);width:3vmin;height:5vmin;background:conic-gradient(#fff 25%,#111 0 50%,#fff 0 75%,#111 0) 0 0/1.5vmin 1.25vmin;border-radius:.4vmin}
.ship{position:absolute;top:50%;width:3.6vmin;height:3.6vmin;margin:-1.8vmin 0 0 -1.8vmin;border-radius:50%;background:var(--c);box-shadow:0 0 1.6vmin var(--c)}
.ship.me{margin-top:-3.2vmin}.ship.foe{margin-top:-.4vmin}
.cnt{font:900 3vmin/1 "Exo 2";white-space:nowrap}
#alarm{position:fixed;left:50%;top:16vmin;transform:translateX(-50%);font:900 4.4vmin/1 "Exo 2";color:#fff;text-shadow:0 0 2vmin #ff2a1a,0 0 .6vmin #ff2a1a;opacity:0;pointer-events:none;white-space:nowrap}
#toast{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.8);font:900 9vmin/1 "Exo 2";letter-spacing:.06em;opacity:0;pointer-events:none;transition:all .25s}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
/* bảng thử (chỉ có ở bản mẫu) */
.panel{position:fixed;right:1.6vmin;bottom:1.6vmin;z-index:5;font:700 14px/1.3 "Exo 2";color:#dbe4f5}
.panel>button{border:0;border-radius:12px;padding:9px 14px;background:rgba(30,40,70,.85);color:#fff;font:800 14px "Exo 2"}
.panel .box{display:none;margin-bottom:8px;width:290px;padding:12px;border-radius:16px;background:rgba(10,16,32,.94);border:1px solid rgba(143,211,255,.25)}
.panel.open .box{display:block}
.box .row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.box button{border:0;border-radius:10px;padding:8px 10px;background:#22304f;color:#fff;font:800 13px "Exo 2"}
.box button.ok{background:#15803d}.box button.no{background:#b91c1c}.box button.w{background:#c2410c}
.box label{display:block;margin-top:8px}
.box input[type=range]{width:100%}
.box .hint{color:#8ea3cf;font-weight:600;font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div id="cv"></div>
<div id="warn"></div>
<div class="top" id="top" style="--tc:#3b8cff">
  <button class="back" type="button">‹</button>
  <div class="team" id="teamChip">TEAM 1</div>
  <div class="link"><i></i>iPad connected</div>
  <div class="track"><div class="ship me" id="shipMe" style="left:38%;--c:#3b8cff"></div><div class="ship foe" id="shipFoe" style="left:30%;--c:#ff7a00"></div><div class="flag"></div></div>
  <div class="cnt">42%</div>
</div>
<div id="alarm"></div>
<div id="toast"></div>
<div class="panel" id="panel">
  <div class="box">
    <div><b>BẢNG THỬ</b> — dữ liệu giả, không nối game</div>
    <div class="row"><button class="ok" data-a="ok">✔ Câu đúng</button><button class="no" data-a="no">✘ Câu sai</button><button data-a="ok5">✔ ×5</button></div>
    <div class="row"><button class="w" data-a="threat">⚠ Tên lửa địch bay tới</button><button data-a="team">Đổi đội</button></div>
    <div class="row"><button data-a="add">+1 tên lửa con</button><button data-a="add5">+5</button><button data-a="clear">Xoá hết</button></div>
    <label>Missiles max: <b id="maxV"></b><input id="maxR" type="range" min="0" max="11" step="1"></label>
    <label>Missile streak (số vạch): <b id="stV"></b><input id="stR" type="range" min="1" max="10" step="1"></label>
    <div class="hint">Chạm hàng tên lửa con = nạp lên ô to · chạm tên lửa to (đã đỏ hết) = bắn · chạm BOOST khi đủ 5 vạch.</div>
  </div>
  <button type="button" id="pBtn">☰ BẢNG THỬ</button>
</div>

<script type="module">
// ROCKET RACE mẫu 11 (14/10/2026) — THIẾT KẾ LẠI BẢNG ĐIỀU KHIỂN iPAD (bản mẫu xem trước, dữ liệu giả).
// Thầy: (1) tên lửa quay MŨI LÊN TRÊN · (2) tên lửa con thành HÀNG sát mép dưới, tối đa 10 quả — không giới hạn ⇒ căn TRÁI + "+x" ở cuối,
// giới hạn ⇒ căn GIỮA (ô trống hiện bóng mờ) · Missiles max 0–10 + nấc ∞ · (3) BOOST trái — cột vạch năng lượng giữa — 2 tên lửa phải, cụm to hơn
// cho cân với cột vạch · (4) bắn ⇒ tên lửa đánh lửa, khói cuộn ở bệ rồi bay TỪ TỪ lên mép trên màn, lửa + khói phụt như tên lửa thật ·
// (5) hai đội y hệt nhau (chỉ khác màu thẻ đội).
// Hình tên lửa = CHÉP từ game10/rr3d-missile.js (cùng hình, cùng vật liệu, cùng shader nạp đỏ từ đuôi lên mũi).
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const easeOutBack = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

// ------------------------------------------------------------------ cảnh
const host = document.getElementById("cv");
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
host.append(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03050b);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.45;
const FOV = 24, VH = 100;                                        // khung nhìn ở z = 0 cao đúng 100 đơn vị
const camera = new THREE.PerspectiveCamera(FOV, 1, 1, 2000);
camera.position.set(0, 0, (VH / 2) / Math.tan(THREE.MathUtils.degToRad(FOV / 2)));
const keyL = new THREE.DirectionalLight(0xfff1e0, 3.2); keyL.position.set(30, 40, 60); scene.add(keyL);
scene.add(new THREE.AmbientLight(0x8090b0, 0.35));
const fireLight = new THREE.PointLight(0xff8a3a, 0, 60, 1.6); scene.add(fireLight);   // lửa phóng soi sáng thân + bệ
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(16, 16), 0.6, 0.5, 1.05);
composer.addPass(bloom); composer.addPass(new OutputPass());

// nền: vài ngôi sao mờ cho có chiều sâu
{ const g = new THREE.BufferGeometry(), n = 260, p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { p[i * 3] = rand(-160, 160); p[i * 3 + 1] = rand(-80, 80); p[i * 3 + 2] = rand(-300, -60); }
  g.setAttribute("position", new THREE.BufferAttribute(p, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0x8090c0, size: 1.1, sizeAttenuation: true, transparent: true, opacity: 0.5 }))); }

function radialTex(stops, size = 128) {
  const c = document.createElement("canvas"); c.width = c.height = size;
  const g = c.getContext("2d"), gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  stops.forEach(([o, col]) => gr.addColorStop(o, col)); g.fillStyle = gr; g.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
function roundRectGeo(w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  const x = -w / 2, y = -h / 2, sh = new THREE.Shape();
  sh.moveTo(x + r, y); sh.lineTo(x + w - r, y); sh.quadraticCurveTo(x + w, y, x + w, y + r);
  sh.lineTo(x + w, y + h - r); sh.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  sh.lineTo(x + r, y + h); sh.quadraticCurveTo(x, y + h, x, y + h - r);
  sh.lineTo(x, y + r); sh.quadraticCurveTo(x, y, x + r, y);
  return new THREE.ShapeGeometry(sh, 8);
}

// ------------------------------------------------------------------ mô hình tên lửa (CHÉP game10/rr3d-missile.js — dọc +X, dài 2,32 đv)
const mRed = new THREE.MeshPhysicalMaterial({ color: "#d4121e", metalness: 0.35, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.08,
  emissive: new THREE.Color("#ff1a24"), emissiveIntensity: 0.22, envMapIntensity: 0.8 });
const mRedDark = new THREE.MeshPhysicalMaterial({ color: "#8e0b14", metalness: 0.4, roughness: 0.35, clearcoat: 0.8, emissive: new THREE.Color("#ff1a24"), emissiveIntensity: 0.1 });
const mWhite = new THREE.MeshPhysicalMaterial({ color: "#eef0f3", metalness: 0.2, roughness: 0.35, clearcoat: 0.6 });
const mDark = new THREE.MeshStandardMaterial({ color: "#2b3039", metalness: 0.85, roughness: 0.32 });
const mGlow = new THREE.MeshBasicMaterial({ color: new THREE.Color(4.2, 0.35, 0.25) });
const mGhost = new THREE.MeshBasicMaterial({ color: new THREE.Color("#8fa0c0"), transparent: true, opacity: 0.16, depthWrite: false });
const mHit = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false });
const alongX = g => { g.rotateZ(-Math.PI / 2); return g; };
const lat = (pts, segs = 32) => new THREE.LatheGeometry(pts.map(([r, y]) => new THREE.Vector2(r, y)), segs);
const GEO = (() => {
  const nosePts = []; for (let i = 0; i <= 12; i++) { const y = i / 12 * 0.62; nosePts.push([Math.max(0.001, 0.2 * Math.pow(1 - Math.pow(y / 0.62, 2), 0.55)), y]); }
  const fs = new THREE.Shape(); fs.moveTo(0, 0); fs.lineTo(0.46, 0); fs.lineTo(0.3, 0.3); fs.lineTo(0.08, 0.3); fs.closePath();
  const fin = new THREE.ExtrudeGeometry(fs, { depth: 0.035, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.012, bevelSegments: 2 });
  fin.translate(-1.1, 0.17, -0.0175);
  return {
    body: alongX(new THREE.CylinderGeometry(0.2, 0.2, 1.5, 32)).translate(-0.2, 0, 0),
    nose: alongX(lat(nosePts)).translate(0.55, 0, 0),
    band: alongX(new THREE.CylinderGeometry(0.204, 0.204, 0.07, 32, 1, true)),
    glow: alongX(new THREE.CylinderGeometry(0.207, 0.207, 0.045, 32, 1, true)).translate(-0.86, 0, 0),
    tail: alongX(lat([[0.001, -0.2], [0.13, -0.2], [0.17, -0.12], [0.2, 0]])).translate(-0.95, 0, 0),
    fin
  };
})();
const BAND_GEO = [0.43, -0.72].map(x => GEO.band.clone().translate(x, 0, 0));
function makeMissile(M = { body: mRed, dark: mRedDark, white: mWhite, tail: mDark, glow: mGlow }) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(GEO.body, M.body), new THREE.Mesh(GEO.nose, M.body), new THREE.Mesh(GEO.tail, M.tail), new THREE.Mesh(GEO.glow, M.glow));
  BAND_GEO.forEach(geo => g.add(new THREE.Mesh(geo, M.white)));
  for (let k = 0; k < 4; k++) { const f = new THREE.Mesh(GEO.fin, M.dark); f.rotation.x = k * Math.PI / 4 * 2 + Math.PI / 4; g.add(f); }
  return g;
}
const ghostMissile = () => { const g = makeMissile(); g.traverse(o => { if (o.isMesh) o.material = mGhost; }); return g; };
// shader "đổ đầy đỏ từ đuôi lên mũi" — y như game (Đợt 454b)
const FILL_SOFT = 0.22;
function fillMat(base, uFill) {
  const m = base.clone(); m.transparent = true;
  m.onBeforeCompile = sh => {
    sh.uniforms.uFill = uFill;
    sh.vertexShader = sh.vertexShader.replace("#include <common>", "#include <common>\nvarying float vLX;")
      .replace("#include <begin_vertex>", "#include <begin_vertex>\nvLX = position.x;");
    sh.fragmentShader = sh.fragmentShader.replace("#include <common>", "#include <common>\nvarying float vLX;\nuniform float uFill;")
      .replace("#include <color_fragment>", `#include <color_fragment>
        diffuseColor.a *= 1.0 - smoothstep(uFill - ${FILL_SOFT.toFixed(3)}, uFill + ${FILL_SOFT.toFixed(3)}, vLX);
        if (diffuseColor.a < 0.01) discard;`)
      .replace("#include <emissivemap_fragment>", `#include <emissivemap_fragment>
        totalEmissiveRadiance += vec3(1.6, 0.45, 0.3) * (1.0 - smoothstep(0.0, ${(FILL_SOFT * 1.2).toFixed(3)}, abs(vLX - uFill))) * step(uFill, 1.3);`);
  };
  m.customProgramCacheKey = () => "awFill454";
  return m;
}
const UPRIGHT = Math.PI / 2;                       // mô hình dọc +X ⇒ quay +90° quanh Z = MŨI LÊN TRÊN
const upright = g => { g.rotation.order = "ZYX"; g.rotation.z = UPRIGHT; return g; };   // ZYX ⇒ rotation.x = xoay quanh CHÍNH trục dọc quả
const BIG_K = 0.85;                                // độ mập/nhỏ của quả trong bảng
const fat = (g, k) => g.scale.set(k, k * 1.35, k * 1.35);   // quả trong bảng mập hơn cho dễ nhìn (như game)
const flareTex = radialTex([[0, "rgba(255,255,255,1)"], [0.2, "rgba(255,220,190,0.9)"], [0.5, "rgba(255,90,60,0.3)"], [1, "rgba(0,0,0,0)"]], 128);
const smokeTex = radialTex([[0, "rgba(255,255,255,0.95)"], [0.35, "rgba(255,255,255,0.55)"], [0.7, "rgba(255,255,255,0.15)"], [1, "rgba(255,255,255,0)"]], 128);

// ------------------------------------------------------------------ trạng thái giả (thay cho trạng thái máy chiếu gửi)
const S = {
  team: 0, max: 5, streak: 3,                       // max 0–10, Infinity = không giới hạn
  reserve: 3, pips: 1, boostPips: 2,
  slots: [{ st: "ready", k: 1 }, { st: "charge", k: 0.35 }],   // st: empty | charge | ready | fly
  threat: -1,                                        // giây tới lúc tên lửa địch nổ (−1 = không có)
};
const BOOST_MAX = 5, CHARGE_S = 2, WINDOW = 1.25;
const atCap = () => S.max !== Infinity && S.reserve >= S.max;   // Missiles max = số tên lửa CON tối đa (2 quả to không tính) — phương án A, chờ thầy chốt

// ------------------------------------------------------------------ dựng bảng
const root = new THREE.Group(); scene.add(root);
const cluster = new THREE.Group(); root.add(cluster);            // BOOST · cột vạch · 2 tên lửa
const rowG = new THREE.Group(); root.add(rowG);                   // hàng tên lửa con
// kích thước (đơn vị cảnh, khung nhìn cao 100)
const BAR_H = 44, BAR_W = 3.2, BTN = 40, BIG_LEN = 50, BIG_PITCH = 27, GAP = 9;
const BIG_SC = BIG_LEN / 2.32 / 1.0;                              // dài 50 đv
const CL_W = BTN + GAP + BAR_W + GAP + BIG_PITCH * 2;
const xBtn = -CL_W / 2 + BTN / 2, xBar = -CL_W / 2 + BTN + GAP + BAR_W / 2;
const xBig = j => xBar + BAR_W / 2 + GAP + BIG_PITCH / 2 + j * BIG_PITCH;

// --- BOOST (nút vuông bo góc + 5 vạch trong + icon 2 mũi tên kép) — giống game, to hơn
const bst = new THREE.Group(); bst.position.set(xBtn, 0, 0); cluster.add(bst);
const btnRimMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0.2, 0.9, 1.2), transparent: true, opacity: 0.5, depthWrite: false });
const btnFaceMat = new THREE.MeshBasicMaterial({ color: new THREE.Color("#0b1624"), transparent: true, opacity: 0.9, depthWrite: false });
const btn = new THREE.Group(); bst.add(btn);
const rim = new THREE.Mesh(roundRectGeo(BTN, BTN, BTN * 0.22), btnRimMat); rim.renderOrder = 20;
const face = new THREE.Mesh(roundRectGeo(BTN * 0.92, BTN * 0.92, BTN * 0.19), btnFaceMat); face.position.z = 0.01; face.renderOrder = 21;
btn.add(rim, face);
const pipsB = [];
{ const inW = BTN * 0.78, inH = BTN * 0.78, gap = inW * 0.04, w = (inW - gap * (BOOST_MAX - 1)) / BOOST_MAX;
  for (let i = 0; i < BOOST_MAX; i++) {
    const x = -inW / 2 + w / 2 + i * (w + gap);
    const back = new THREE.Mesh(roundRectGeo(w, inH, w * 0.3), new THREE.MeshBasicMaterial({ color: new THREE.Color(0.03, 0.09, 0.14), transparent: true, opacity: 0.9, depthWrite: false }));
    back.position.set(x, 0, 0.02); back.renderOrder = 22;
    const fm = new THREE.MeshBasicMaterial({ color: new THREE.Color(0, 0.55, 0.78), transparent: true, opacity: 0, depthWrite: false });
    const f = new THREE.Mesh(roundRectGeo(w, inH, w * 0.3), fm); f.position.set(x, 0, 0.03); f.renderOrder = 23;
    btn.add(back, f); pipsB.push({ fm, k: 0 });
  } }
const iconTex = (() => { const cv = document.createElement("canvas"); cv.width = cv.height = 256; const g = cv.getContext("2d");
  g.strokeStyle = "#fff"; g.lineCap = "round"; g.lineJoin = "round"; g.lineWidth = 30;
  [166, 112].forEach(y => { g.beginPath(); g.moveTo(66, y + 42); g.lineTo(128, y - 20); g.lineTo(190, y + 42); g.stroke(); });
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t; })();
const iconMat = new THREE.MeshBasicMaterial({ map: iconTex, color: new THREE.Color(0.35, 0.6, 0.75), transparent: true, opacity: 0.55, depthWrite: false });
const icon = new THREE.Mesh(new THREE.PlaneGeometry(BTN * 0.66, BTN * 0.66), iconMat); icon.position.z = 0.04; icon.renderOrder = 24; btn.add(icon);
const bGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: flareTex, color: new THREE.Color(0.2, 1.6, 2.2), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0 }));
bGlow.scale.set(BTN * 2.2, BTN * 2.2, 1); bGlow.position.z = -0.5; bst.add(bGlow);
const nowCv = document.createElement("canvas"); nowCv.width = 768; nowCv.height = 128;
{ const g = nowCv.getContext("2d"); g.font = '900 78px "Exo 2", sans-serif'; g.textAlign = "center"; g.textBaseline = "middle";
  g.shadowColor = "rgba(0,200,255,.9)"; g.shadowBlur = 16; g.fillStyle = "#fff"; g.fillText("BOOST NOW!", 384, 66); }
const nowTex = new THREE.CanvasTexture(nowCv); nowTex.colorSpace = THREE.SRGBColorSpace;
const boostNow = new THREE.Sprite(new THREE.SpriteMaterial({ map: nowTex, transparent: true, depthWrite: false, opacity: 0 }));
boostNow.material.toneMapped = false; boostNow.scale.set(BTN * 1.5, BTN * 0.25, 1); boostNow.position.set(0, -BTN * 0.68, 1); boostNow.renderOrder = 30; bst.add(boostNow);
const hitBoost = new THREE.Mesh(new THREE.PlaneGeometry(BTN * 1.2, BTN * 1.2), mHit); hitBoost.position.z = 2; hitBoost.userData.k = "boost"; bst.add(hitBoost);

// --- CỘT VẠCH NĂNG LƯỢNG (giữa) — sáng từ dưới lên, đủ vạch ⇒ +1 tên lửa con

}
let toastT = 0;
function toast(txt, col) { const e = document.getElementById("toast"); e.textContent = txt; e.style.color = col; e.style.textShadow = `0 0 3vmin ${col}`; e.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove("on"), 900); }

// chạm
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const hits = [hitBoost, rowHit, ...bigs.map(B => B.g.children.find(o => o.userData.k === "fire"))];
renderer.domElement.addEventListener("pointerdown", e => {
  e.preventDefault();
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const h = ray.intersectObjects(hits.filter(o => { let p = o; while (p) { if (!p.visible) return false; p = p.parent; } return true; }), false)[0];
  if (!h) return;
  const k = h.object.userData.k;
  if (k === "boost") tapBoost(); else if (k === "fire") tapFire(); else if (k === "load") tapLoad();
});

// ------------------------------------------------------------------ vòng vẽ
let last = performance.now(), T = 0;
const warnEl = document.getElementById("warn"), alarmEl = document.getElementById("alarm");
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); composer.render();
}
function update(dt) {
  T += dt;
  S.slots.forEach(s => { if (s.st === "charge") { s.k += dt / CHARGE_S; if (s.k >= 1) { s.k = 1; s.st = "ready"; } } });
  if (S.threat >= 0) { S.threat -= dt; if (S.threat < 0) { S.threat = -1; toast("HIT!", "#ff5a4a"); } }
  const thr = S.threat >= 0, win = thr && S.threat <= WINDOW, pul = 0.5 + 0.5 * Math.sin(T * (win ? 16 : 5));
  warnEl.style.opacity = thr ? (win ? 0.35 + 0.65 * pul : 0.15 + 0.3 * pul) : 0;
  alarmEl.style.opacity = thr ? 1 : 0; if (thr) alarmEl.textContent = "⚠ INCOMING  " + S.threat.toFixed(1) + " s";
  tickUI(dt, T); stepFlights(dt); stepSmoke(dt);
}
window.__step = sec => { for (let i = 0; i < Math.round(sec * 60); i++) update(1 / 60); composer.render(); };   // bàn thử: tua khi khung bị ẩn
requestAnimationFrame(frame);

// ------------------------------------------------------------------ bảng thử
const panel = document.getElementById("panel");
document.getElementById("pBtn").onclick = () => panel.classList.toggle("open");
const maxR = document.getElementById("maxR"), stR = document.getElementById("stR");
const paint = () => { document.getElementById("maxV").textContent = isInf() ? "∞ (không giới hạn)" : S.max; document.getElementById("stV").textContent = S.streak;
  maxR.value = isInf() ? 11 : S.max; stR.value = S.streak; };
maxR.oninput = () => { const v = +maxR.value; S.max = v >= 11 ? Infinity : v; if (!isInf()) S.reserve = Math.min(S.reserve, Math.max(0, S.max)); paint(); };
stR.oninput = () => { S.streak = +stR.value; S.pips = Math.min(S.pips, S.streak - 1); paint(); };
panel.querySelector(".box").addEventListener("click", e => {
  const a = e.target.dataset && e.target.dataset.a; if (!a) return;
  if (a === "ok") correct();
  else if (a === "ok5") for (let i = 0; i < 5; i++) correct();
  else if (a === "no") wrong();
  else if (a === "threat") S.threat = 3.8;
  else if (a === "add" || a === "add5") { for (let i = 0; i < (a === "add" ? 1 : 5); i++) if (isInf() || S.reserve < (S.max | 0)) S.reserve++; }
  else if (a === "clear") S.reserve = 0;
  else if (a === "team") { S.team = 1 - S.team; const c = S.team ? "#ff7a00" : "#3b8cff";
    document.getElementById("teamChip").textContent = S.team ? "TEAM 2" : "TEAM 1"; document.getElementById("top").style.setProperty("--tc", c);
    document.getElementById("shipMe").style.setProperty("--c", c); document.getElementById("shipFoe").style.setProperty("--c", S.team ? "#3b8cff" : "#ff7a00"); }
});
paint();
window.__S = S; window.__t = { tapFire, tapLoad, tapBoost, correct };   // bàn thử
</script>
